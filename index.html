<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>改裝帳本 BUILD SHEET</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F1512;
  --panel:#161E1A;
  --panel2:#1B2620;
  --line:#28352D;
  --ink:#EAE7DB;
  --sub:#8D9A8E;
  --manx:#2FBF71;
  --manx-deep:#17573B;
  --gold:#C9A45C;
  --gray:#77837A;
  --num:'Chakra Petch',monospace;
  --tc:'Noto Sans TC',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
/* hidden 屬性必須勝過元素自己的 display,否則 display:flex 會讓隱藏失效 */
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--tc);line-height:1.55;padding-bottom:80px}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}

/* ── header ── */
header{border-bottom:1px solid var(--line);background:linear-gradient(180deg,#121A16 0%,var(--bg) 100%)}
.head-in{max-width:860px;margin:0 auto;padding:22px 16px 0}
.eyebrow{font-family:var(--num);font-size:11px;letter-spacing:.32em;color:var(--manx);text-transform:uppercase}
h1{font-weight:900;font-size:34px;letter-spacing:.06em;line-height:1.1;margin-top:4px}
h1 small{display:block;font-family:var(--num);font-weight:600;font-size:12px;letter-spacing:.28em;color:var(--sub);margin-top:6px}
@media(max-width:420px){h1{font-size:27px}}
.mode{display:flex;gap:0;margin-top:20px;border:1px solid var(--line);border-bottom:none;border-radius:10px 10px 0 0;overflow:hidden;width:fit-content}
.mode button{appearance:none;border:none;background:transparent;color:var(--sub);font-family:var(--tc);font-weight:700;font-size:14px;padding:10px 22px;cursor:pointer;transition:.15s}
.mode button.on{background:var(--panel2);color:var(--ink);box-shadow:inset 0 2px 0 var(--manx)}
.mode button:focus-visible{outline:2px solid var(--manx);outline-offset:-2px}

/* ── 車名就地編輯 ── */
h1.unset #veh-name{color:var(--sub);font-weight:700}
.editable{cursor:text;border-bottom:1px dashed transparent;transition:border-color .15s}
.editable:hover{border-bottom-color:var(--sub)}
.pen{font-size:12px;color:#4a564d;margin-left:9px;cursor:pointer;vertical-align:9px;transition:color .15s;user-select:none}
.pen:hover{color:var(--manx)}
h1 small .pen{vertical-align:1px;margin-left:7px;font-size:10px}
.inline-in{font:inherit;color:var(--ink);background:#0B100D;border:1px solid var(--manx);border-radius:8px;padding:0 8px;max-width:100%;letter-spacing:inherit}
.inline-in:focus{outline:none}
#veh-name-in{font-size:34px;font-weight:900;width:min(9em,100%)}
@media(max-width:420px){#veh-name-in{font-size:27px}}
#veh-sub-in{font-family:var(--num);font-size:12px;font-weight:600;letter-spacing:.28em;width:min(18em,100%);padding:2px 8px}

/* ── stats ── */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0}
@media(min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px}
.stat .k{font-size:12px;color:var(--sub);letter-spacing:.08em}
.stat .v{font-family:var(--num);font-weight:700;font-size:22px;margin-top:2px;letter-spacing:.02em}
.stat.total .v{color:var(--manx)}
.stat.wish .v{color:var(--gold)}
.stat.out .v{color:var(--gray)}

/* ── bars ── */
.bars{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:18px}
.bars h3{font-size:13px;color:var(--sub);font-weight:500;letter-spacing:.1em;margin-bottom:12px}
.bar-row{display:grid;grid-template-columns:52px 1fr 84px;align-items:center;gap:10px;margin-bottom:8px;font-size:13px}
.bar-track{height:8px;background:#0C110E;border-radius:4px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--manx-deep),var(--manx));border-radius:4px}
.bar-amt{font-family:var(--num);font-weight:600;text-align:right;color:var(--sub);font-size:12px}

/* ── filters ── */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--sub);border-radius:999px;font-family:var(--tc);font-size:13px;padding:6px 14px;cursor:pointer;transition:.15s}
.chip.on{border-color:var(--manx);color:var(--ink);background:var(--manx-deep)}
.chip.gold.on{border-color:var(--gold);background:#4a3c1e}
.chip.gray.on{border-color:var(--gray);background:#2b3230}
.search{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--ink);font-family:var(--tc);font-size:14px;padding:10px 14px;margin-bottom:14px}
.search::placeholder{color:#5c675e}
.search:focus{outline:none;border-color:var(--manx)}

/* ── list ── */
.rows{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.row{display:grid;grid-template-columns:8px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s}
.row:hover{background:#1B2620}
.row.editing{background:#1B2A21;box-shadow:inset 3px 0 0 var(--manx)}
.row:last-child{border-bottom:none}
.dot{width:8px;height:8px;border-radius:50%}
.dot.on{background:var(--manx)}.dot.out{background:var(--gray)}.dot.wish{background:var(--gold)}
.row .name{font-size:14px;font-weight:500}
.row .name b{font-family:var(--num);font-weight:600;letter-spacing:.04em;color:var(--ink);margin-right:6px}
.row .meta{font-size:11.5px;color:var(--sub);margin-top:2px}
.row .price{font-family:var(--num);font-weight:600;font-size:15px;text-align:right;white-space:nowrap}
.row .price.tbd{color:var(--sub);font-size:12px;font-weight:500}
.row.out .name,.row.out .price{color:var(--gray)}
.count-note{font-size:12px;color:var(--sub);margin:10px 2px 24px}

/* ── 分頁 ── */
.pager{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:12px}
.pg{appearance:none;min-width:32px;height:32px;padding:0 9px;background:var(--panel);border:1px solid var(--line);color:var(--sub);border-radius:8px;font-family:var(--num);font-weight:600;font-size:13px;cursor:pointer;transition:.15s}
.pg:hover:not(:disabled){color:var(--ink);border-color:var(--sub)}
.pg.on{background:var(--manx-deep);border-color:var(--manx);color:var(--ink)}
.pg:disabled{opacity:.28;cursor:default}
.pg-gap{color:var(--sub);font-size:13px;padding:0 2px}
.pg-info{font-family:var(--num);font-size:12px;color:var(--sub);margin-left:auto;white-space:nowrap}

/* ── 空狀態 ── */
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:26px 20px;text-align:center;color:var(--sub);font-size:13.5px;line-height:2}
.empty b{color:var(--ink);font-weight:700}
.empty .big{font-size:15px;color:var(--ink);font-weight:700;margin-bottom:6px;display:block}

/* ── add form ── */
.addbox{background:var(--panel2);border:1px dashed var(--line);border-radius:12px;padding:16px;margin-top:8px}
.addbox h3{font-size:14px;margin-bottom:12px}
.addbox .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.addbox label{display:block;font-size:11.5px;color:var(--sub);margin-bottom:4px}
.addbox input,.addbox select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-family:var(--tc);font-size:14px;padding:9px 10px}
.addbox input:focus,.addbox select:focus{outline:none;border-color:var(--manx)}
.addbox .full{grid-column:1/-1}
.addbox .btns{display:flex;gap:8px;margin-top:12px}
.addbox .btns button{appearance:none;border:none;font-family:var(--tc);font-weight:700;font-size:14px;padding:11px 18px;border-radius:9px;cursor:pointer}
.addbox .btns .main{background:var(--manx);color:#08130D;flex:1}
.addbox .btns .ghost{background:transparent;border:1px solid var(--line);color:var(--sub)}
.addbox .btns .danger{background:#3A2020;border:1px solid #5A2E2E;color:#E08A8A}
.addbox .btns .swap{background:#3E3218;border:1px solid #5A4A26;color:var(--gold)}
.addbox .btns button:active{transform:translateY(1px)}
.badge{display:inline-block;font-size:10px;font-weight:500;color:var(--gold);border:1px solid #5A4A26;border-radius:4px;padding:1px 6px;margin-left:7px;vertical-align:2px;letter-spacing:.12em}
.addon-box{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
.addon-box>label{display:block;font-size:11.5px;color:var(--sub);margin-bottom:6px}
.addon-chip{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--bg);border:1px solid #3E3218;border-radius:8px;padding:7px 10px;margin-bottom:6px;font-size:13px}
.addon-chip .t{color:var(--gold)}
.addon-chip .p{font-family:var(--num);font-weight:600;margin-left:auto}
.addon-chip .x{appearance:none;background:none;border:none;color:var(--sub);font-size:14px;cursor:pointer;padding:0 2px}
.addon-in{display:grid;grid-template-columns:1fr 96px 34px;gap:6px}
.addon-in input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-family:var(--tc);font-size:13px;padding:8px 10px}
.addon-in input:focus{outline:none;border-color:var(--gold)}
.addon-in button{appearance:none;background:#3E3218;border:1px solid #5A4A26;color:var(--gold);border-radius:8px;font-size:16px;cursor:pointer}
.addbox .hint{font-size:11.5px;color:var(--sub);margin-top:8px;text-align:center}

/* ── 資料管理 ── */
.data-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin:26px 0 8px}
.data-box h3{font-size:13px;color:var(--sub);font-weight:500;letter-spacing:.1em;margin-bottom:12px}
.data-btns{display:flex;flex-wrap:wrap;gap:8px}
.data-btns button{appearance:none;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:9px;font-family:var(--tc);font-size:13px;padding:10px 15px;cursor:pointer}
.data-btns button:hover{border-color:var(--sub)}
.data-btns button:active{transform:translateY(1px)}
.data-btns .danger{color:#E08A8A;border-color:#5A2E2E;background:#2A1A1A}
.save-state{font-size:11.5px;color:var(--sub);margin-top:12px;line-height:1.7}
.save-state.fail{color:#E08A8A}
.data-hint{font-size:11.5px;color:var(--sub);margin-top:10px;line-height:1.7}

/* ── 備份提醒 ── */
.bk-note{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#241F14;border:1px solid #5A4A26;border-radius:12px;padding:12px 14px;margin-bottom:18px}
.bk-note .t{flex:1;min-width:170px;font-size:12.5px;color:var(--gold);line-height:1.6}
.bk-note button{appearance:none;font-family:var(--tc);font-size:12.5px;padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
.bk-note .go{background:var(--gold);border:none;color:#241C08;font-weight:700}
.bk-note .later{background:transparent;border:1px solid #5A4A26;color:var(--sub)}
.bk-note button:active{transform:translateY(1px)}

/* ── showcase ── */
.plate{position:relative;border:1px solid var(--line);border-radius:16px;background:
  radial-gradient(120% 160% at 0% 0%,#1B2A21 0%,var(--panel) 55%);
  padding:28px 22px 24px;margin:20px 0 26px;overflow:hidden}
.plate::after{content:"";position:absolute;inset:8px;border:1px solid #2c3a31;border-radius:11px;pointer-events:none}
.plate .eyebrow{margin-bottom:2px}
.plate h2{font-weight:900;font-size:40px;letter-spacing:.08em;line-height:1.05}
@media(max-width:420px){.plate h2{font-size:31px}}
.plate .en{font-family:var(--num);font-size:12px;letter-spacing:.3em;color:var(--sub);margin-top:6px;text-transform:uppercase}
.plate-stats{display:flex;align-items:flex-end;gap:24px;margin-top:20px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.plate-stats::-webkit-scrollbar{display:none}
.plate-stats .ps{flex:0 0 auto}
.plate-stats .k{font-size:11px;color:var(--sub);white-space:nowrap}
.plate-stats .v{font-family:var(--num);font-weight:600;font-size:18px;white-space:nowrap;line-height:1.25}
.plate-stats .ps.big .k{font-size:12px;letter-spacing:.14em}
.plate-stats .ps.big .v{font-weight:700;font-size:40px;color:var(--manx);letter-spacing:.02em;line-height:1.1}
@media(max-width:420px){.plate-stats{gap:18px}}

.sec{margin-bottom:26px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--manx-deep);padding-bottom:8px;margin-bottom:2px}
.sec-head h3{font-size:16px;font-weight:900;letter-spacing:.12em}
.sec-head .en{font-family:var(--num);font-size:10px;letter-spacing:.26em;color:var(--sub);text-transform:uppercase}
.sec-head .sum{font-family:var(--num);font-weight:600;font-size:14px;color:var(--manx)}
.cat-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line)}
.cat-row:last-child{border-bottom:none}
.cat-row .b{font-family:var(--num);font-weight:600;font-size:12.5px;letter-spacing:.08em;color:var(--manx);min-width:86px;text-transform:uppercase}
.cat-row .n{font-size:14px;flex:1}
.cat-row .p{font-family:var(--num);font-weight:600;font-size:14px;white-space:nowrap}
.cat-row .p.tbd{color:var(--sub);font-size:12px;font-weight:500}
.sec.gold .sec-head{border-color:#5a4a26}
.sec.gold .sec-head .sum{color:var(--gold)}
.sec.gold .cat-row .b{color:var(--gold)}
.sec.gray .sec-head{border-color:#39423c}
.sec.gray .sec-head .sum{color:var(--gray)}
.sec.gray .cat-row{color:var(--gray)}
.sec.gray .cat-row .b{color:var(--gray)}
.sec.gray .cat-row .n,.sec.gray .cat-row .p{color:var(--gray)}

/* ── showcase edit tools ── */
.show-tools{display:flex;justify-content:flex-end;margin:16px 0 -8px}
.show-tools .chip.on{border-color:var(--manx);color:var(--ink);background:var(--manx-deep)}
.edit-hint{font-size:11.5px;color:var(--sub);text-align:right;margin:6px 0 0}
.tools{display:inline-flex;gap:4px;margin-left:8px;flex-shrink:0}
.mini{appearance:none;background:var(--panel2);border:1px solid var(--line);color:var(--sub);border-radius:6px;font-size:11px;width:26px;height:26px;cursor:pointer;line-height:1;padding:0}
.mini:hover{color:var(--ink);border-color:var(--sub)}
.mini:disabled{opacity:.25;cursor:default}
.mini.eye-off{color:var(--gold);border-color:#5a4a26}
.cat-row.dim{opacity:.32}
.sec.dim-sec .sec-head,.sec.dim-sec .cat-row{opacity:.32}
.tune.dim{opacity:.32}
.tune h3{display:flex;align-items:center;justify-content:space-between}
.tune .cell .k input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--sub);font-family:var(--tc);font-size:11.5px;padding:5px 8px}
.tune .v-row{display:flex;gap:6px;margin-top:6px;align-items:center}
.tune .v-in{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--ink);font-family:var(--num);font-weight:700;font-size:16px;padding:5px 8px;min-width:0}
.tune .cell input:focus{outline:none;border-color:var(--manx)}
.tune-add{margin-top:10px;appearance:none;background:transparent;border:1px dashed var(--line);color:var(--sub);border-radius:8px;font-family:var(--tc);font-size:12.5px;padding:8px 14px;cursor:pointer;width:100%}
.tune-add:hover{color:var(--ink);border-color:var(--sub)}
.sub-div{font-family:var(--num);font-size:10px;font-weight:600;letter-spacing:.26em;color:var(--sub);text-transform:uppercase;margin:12px 0 2px;padding-left:2px}
.thumb{width:38px;height:38px;border-radius:8px;object-fit:cover;border:1px solid var(--line);flex-shrink:0;background:#0C110E}
.cat-row .thumb{width:44px;height:44px;cursor:zoom-in}
.thumb-ph{width:44px;height:44px;border-radius:8px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--sub);cursor:pointer;flex-shrink:0;margin-right:10px}
.thumb-ph:hover{color:var(--ink);border-color:var(--sub)}
.cover{width:100%;height:190px;object-fit:cover;border-radius:10px;margin:14px 0 4px;border:1px solid #2c3a31;cursor:zoom-in}
.cover-btns{display:flex;gap:8px;justify-content:flex-end;margin:8px 0 18px;flex-wrap:wrap}
.cover-btns button{appearance:none;background:var(--panel);border:1px solid var(--line);color:var(--sub);border-radius:8px;font-size:12.5px;font-family:var(--tc);padding:7px 14px;cursor:pointer}
#lightbox{position:fixed;inset:0;background:rgba(8,13,10,.93);display:none;align-items:center;justify-content:center;z-index:60;padding:18px;cursor:zoom-out}
#lightbox.on{display:flex}
#lightbox img{max-width:100%;max-height:100%;border-radius:12px;border:1px solid var(--line)}

.tune{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:26px}
.tune h3{font-size:14px;font-weight:900;letter-spacing:.1em;margin-bottom:12px}
.tune .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.tune .grid{grid-template-columns:1fr}}
.tune .cell{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
.tune .cell .k{font-size:11.5px;color:var(--sub)}
.tune .cell .v{font-family:var(--num);font-weight:700;font-size:20px;margin-top:2px}
.tune .cell .v span{font-size:12px;color:var(--sub);font-weight:500;margin-left:4px}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(18px);background:var(--panel2);border:1px solid var(--manx-deep);color:var(--ink);padding:10px 20px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:70;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.view{display:none}
.view.on{display:block}
footer{margin-top:36px;text-align:center;font-size:11.5px;color:#5c675e;letter-spacing:.06em}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="head-in">
    <div class="eyebrow">Build Sheet · Mod Ledger</div>
    <h1 id="veh-h1">
      <span id="veh-name" class="editable" onclick="editInline('name')" title="點一下修改車名">我的愛車</span>
      <input id="veh-name-in" class="inline-in" maxlength="24" placeholder="車名" hidden>
      <span class="pen" onclick="editInline('name')" title="修改車名">✎</span>
      <small><span id="veh-sub" class="editable" onclick="editInline('sub')" title="點一下修改標語">BUILD SHEET</span><input id="veh-sub-in" class="inline-in" maxlength="48" placeholder="英文標語" hidden><span class="pen" onclick="editInline('sub')" title="修改標語">✎</span></small>
    </h1>
    <div class="mode" role="tablist">
      <button id="tab-rec" class="on" onclick="setMode('rec')">紀錄模式</button>
      <button id="tab-show" onclick="setMode('show')">展示模式</button>
    </div>
  </div>
</header>

<div class="wrap">

  <!-- ═══════════ 紀錄模式 ═══════════ -->
  <div id="view-rec" class="view on">
    <div class="stats" id="stats"></div>
    <div class="bk-note" id="bk-note" hidden></div>
    <div class="bars" id="bars"></div>

    <div class="addbox" id="addbox">
      <h3 id="form-title">＋ 新增項目</h3>
      <div class="grid">
        <div><label>品牌</label><input id="a-brand" placeholder="可留空"></div>
        <div><label>完工價 (NT$)</label><input id="a-price" type="number" inputmode="numeric" placeholder="0 = 未定價"></div>
        <div class="full"><label>品項名稱</label><input id="a-name" placeholder="例:前土除"></div>
        <div><label>分類</label><select id="a-cat"></select></div>
        <div><label>狀態</label><select id="a-status">
          <option value="on">現役</option><option value="wish">願望清單</option><option value="out">已退役</option>
        </select></div>
        <div><label>日期</label><input id="a-date" type="date"></div>
        <div><label>位置(展示排版用)</label><select id="a-pos">
          <option value="">不分區</option><option value="F">前段</option><option value="R">後段</option>
        </select></div>
        <div id="rec-wrap" hidden><label>舊零件回收金額 (NT$)</label><input id="a-rec" type="number" inputmode="numeric" placeholder="沒賣掉就填 0"></div>
      </div>
      <div class="addon-box">
        <label>附加費用(客製加工、後續工資,計入此零件的總花費)</label>
        <div id="addon-list"></div>
        <div class="addon-in">
          <input id="a-add-t" placeholder="名目,例:加工費、工資">
          <input id="a-add-p" type="number" inputmode="numeric" placeholder="金額">
          <button onclick="addAddon()" title="加入附加費用">＋</button>
        </div>
      </div>
      <div class="btns">
        <button class="main" id="btn-save" onclick="saveItem()">加入清單</button>
        <button class="swap" id="btn-swap" onclick="startSwap()" hidden>⇄ 汰換</button>
        <button class="ghost" id="btn-cancel" onclick="resetForm()" hidden>取消</button>
        <button class="danger" id="btn-del" onclick="deleteItem()" hidden>刪除</button>
      </div>
      <div class="hint">點下方清單的任一項目即可修改或刪除 · 資料會自動存在這台裝置的瀏覽器裡</div>
    </div>

    <input class="search" id="q" placeholder="搜尋品牌或品項…" oninput="STATE.q=this.value;resetPage();renderList()">
    <div class="filters" id="f-status"></div>
    <div class="filters" id="f-cat"></div>

    <div class="rows" id="rows"></div>
    <div class="pager" id="pager" hidden></div>
    <div class="count-note" id="count-note"></div>

    <div class="data-box">
      <h3>資料管理</h3>
      <div class="data-btns">
        <button onclick="exportData()">⬇ 備份資料</button>
        <button onclick="document.getElementById('import-file').click()">⬆ 還原資料</button>
        <button class="danger" onclick="clearAll()">🗑 清空全部</button>
      </div>
      <div class="data-hint" id="data-hint"></div>
      <div class="save-state" id="save-state"></div>
    </div>
  </div>

  <!-- ═══════════ 展示模式 ═══════════ -->
  <div id="view-show" class="view">
    <div class="show-tools">
      <button class="chip" id="btn-layout" onclick="toggleShowEdit()">✎ 編輯版面</button>
    </div>
    <div class="edit-hint" id="edit-hint" hidden>▲▼ 調整順序 · 👁 決定要不要展示 · 隱藏只影響這一頁,紀錄模式的資料都還在</div>
    <div class="plate" id="plate"></div>
    <div class="cover-btns" id="cover-btns"></div>
    <div id="show-secs"></div>
    <div id="show-wish"></div>
  </div>

  <footer id="foot">BUILD SHEET · MOD LEDGER</footer>
</div>

<div id="lightbox" onclick="this.classList.remove('on')"><img id="lightbox-img" alt=""></div>
<div id="toast"></div>
<div hidden>
  <input type="file" id="a-cover" accept="image/*" onchange="pickCover(this)">
  <input type="file" id="item-photo-input" accept="image/*" onchange="onItemPhotoChosen(this)">
  <input type="file" id="import-file" accept=".txt,.json,text/plain,application/json" onchange="importData(this)">
</div>

<script>
const CATS=['制動','懸吊','動力','外觀','其他'];
const CAT_EN={制動:'Brake',懸吊:'Suspension',動力:'Powertrain',外觀:'Body & Parts',其他:'Misc'};
const ST_NAME={on:'現役',out:'已退役',wish:'願望清單'};
const POS_NAME={F:'前段',R:'後段'};
// 舊分類 → 新大分類的對應表(之後想再調整分類定義,改這裡就好)
const LEGACY={傳動:'動力',燈電:'外觀',操控:'外觀'};
const STORE_KEY='buildsheet.v1';
const SCHEMA=1;

/* ── 資料(空白起步,由 localStorage 或匯入檔載入) ── */
let VEHICLE={name:'',sub:''};
let ITEMS=[];
let TUNE=[];
let LAYOUT={catOrder:[...CATS],wish:true,tune:true,cover:null};
let NEXT_ID=0;
let BK=0;         // 最後一次備份的時間
let BK_SNOOZE=0;  // 備份提醒按「稍後再說」的時間
const DAY=86400000;

let SWAP_ID=null,EDIT_ID=null,FORM_ADD=[],SHOW_EDIT=false,PHOTO_TARGET=null;
const STATE={status:'all',cat:'all',q:''};
const PAGE_SIZE=5;          // 紀錄模式清單每頁筆數
let PAGE=1;
const stamp=()=>Date.now();  // mt:最後修改時間,用於「最近修改」排序
// 篩選或搜尋改變時回到第一頁
function resetPage(){PAGE=1;}
function goPage(p){PAGE=p;renderList();document.getElementById('rows').scrollIntoView({behavior:'smooth',block:'nearest'});}

const today=()=>{const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')};
const fmt=n=>'NT$ '+n.toLocaleString('zh-TW');
const addSum=i=>(i.add||[]).reduce((t,a)=>t+a.p,0);
const itemTotal=i=>i.p+addSum(i);
const sum=a=>a.reduce((t,i)=>t+itemTotal(i),0);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ══════════ 儲存 / 讀取 / 匯出入 ══════════ */
function snapshot(){return{v:SCHEMA,savedAt:new Date().toISOString(),vehicle:VEHICLE,items:ITEMS,tune:TUNE,layout:LAYOUT,nextId:NEXT_ID,bk:BK,bkSnooze:BK_SNOOZE}}

let saveTimer=null;
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(doSave,400)}
function doSave(){
  try{
    localStorage.setItem(STORE_KEY,JSON.stringify(snapshot()));
    setSaveState(true);
  }catch(e){
    setSaveState(false,e);
  }
}
function setSaveState(ok,err){
  const el=document.getElementById('save-state');
  if(!el)return;
  el.classList.toggle('fail',!ok);
  if(ok){
    const kb=Math.round((localStorage.getItem(STORE_KEY)||'').length/1024);
    const last=BK?'上次備份 '+new Date(BK).toLocaleDateString('zh-TW'):'尚未備份過';
    el.textContent='✔ 已自動儲存在這台裝置的瀏覽器('+kb+' KB) · '+last+' · 換手機或清除瀏覽資料就會不見,重要的話請按「備份資料」留一份。';
  }else{
    el.textContent='⚠ 儲存失敗:瀏覽器空間已滿(通常是照片太多)。請先按「備份資料」把內容存起來,再移除幾張照片。錯誤:'+(err&&err.name||'unknown');
  }
}

function loadSaved(){
  let raw=null;
  try{raw=localStorage.getItem(STORE_KEY)}catch(e){return false}
  if(!raw)return false;
  try{applyData(JSON.parse(raw));return true}
  catch(e){console.warn('本機資料損毀,已略過',e);return false}
}

function applyData(d){
  if(!d||typeof d!=='object')throw new Error('不是有效的備份內容');
  if(!Array.isArray(d.items))throw new Error('找不到零件清單(items)');
  VEHICLE={name:(d.vehicle&&d.vehicle.name)||'',sub:(d.vehicle&&d.vehicle.sub)||''};
  ITEMS=d.items.map(i=>({...i}));
  TUNE=Array.isArray(d.tune)?d.tune.map(t=>({k:t.k||'',v:t.v||''})):[];
  const L=d.layout||{};
  const order=(Array.isArray(L.catOrder)?L.catOrder:[]).filter(c=>CATS.includes(c));
  CATS.forEach(c=>{if(!order.includes(c))order.push(c)});
  LAYOUT={catOrder:order,wish:L.wish!==false,tune:L.tune!==false,cover:L.cover||null};
  // 正規化:舊分類轉新分類、補日期、金額轉數字
  ITEMS.forEach(i=>{
    i.c=LEGACY[i.c]||i.c;
    if(!CATS.includes(i.c))i.c='其他';
    if(!['on','out','wish'].includes(i.s))i.s='on';
    i.d=i.d||today();
    i.p=Math.max(0,parseInt(i.p)||0);
    if(i.mt!=null)i.mt=Number(i.mt)||0;   // 最後修改時間,舊備份沒有此欄位
    if(i.add)i.add=i.add.filter(a=>a&&a.t).map(a=>({t:a.t,p:Math.max(0,parseInt(a.p)||0)}));
  });
  NEXT_ID=Math.max(0,d.nextId|0,...ITEMS.map(i=>(typeof i.id==='number'?i.id+1:0)));
  ITEMS.forEach(i=>{if(typeof i.id!=='number')i.id=NEXT_ID++});
  BK=Number(d.bk)||0;
  BK_SNOOZE=Number(d.bkSnooze)||0;
}

/* 備份檔用 .txt 而非 .json:Chromium 的 Web Share 只允許白名單內的檔案類型
   (音訊、圖片、PDF、影片、文字),.json 不在其中,用 .json 會導致手機分享失敗。
   內容仍是 JSON 文字,還原時照樣解析得回來。 */
const BK_MIME='text/plain';
const bkFileName=()=>(VEHICLE.name||'改裝帳本')+'_備份_'+today()+'.txt';

function canShareBackup(){
  try{
    return !!(navigator.canShare&&
      navigator.canShare({files:[new File(['{}'],'t.txt',{type:BK_MIME})]}));
  }catch(e){return false}
}

async function exportData(){
  const data=JSON.stringify(snapshot(),null,2);
  const name=bkFileName();
  // 手機優先:叫出系統分享選單,可直接存到 LINE、雲端硬碟或檔案 App
  try{
    const file=new File([data],name,{type:BK_MIME});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:'改裝帳本備份'});
      markBackedUp('已分享備份 · '+ITEMS.length+' 筆');
      return;
    }
  }catch(e){
    if(e&&e.name==='AbortError')return;   // 使用者自己取消,不要再彈下載
  }
  downloadBackup(data,name);              // 桌機或不支援分享時的退路
}

function downloadBackup(data,name){
  const url=URL.createObjectURL(new Blob([data],{type:BK_MIME}));
  const a=document.createElement('a');
  a.href=url;a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
  markBackedUp('已下載備份 · '+ITEMS.length+' 筆');
}

function markBackedUp(msg){
  BK=Date.now();BK_SNOOZE=0;
  doSave();renderBackupNote();
  toast(msg);
}

/* ── 備份提醒 ── */
function backupHint(){
  if(!ITEMS.length)return '';
  if(BK_SNOOZE&&Date.now()-BK_SNOOZE<7*DAY)return '';
  if(!BK)return ITEMS.length>=5
    ?'你還沒備份過。資料只存在這台裝置,換手機或清除瀏覽資料就會消失。':'';
  const newest=Math.max(0,...ITEMS.map(i=>i.mt||0));
  if(newest<=BK)return '';                       // 上次備份後沒有異動
  const days=Math.floor((Date.now()-BK)/DAY);
  return days>=14?`距離上次備份已經 ${days} 天,期間有新的異動。`:'';
}

function renderBackupNote(){
  const el=document.getElementById('bk-note');
  const msg=backupHint();
  if(!msg){el.hidden=true;el.innerHTML='';return;}
  el.hidden=false;
  el.innerHTML=`<span class="t">${msg}</span>
    <button class="go" onclick="exportData()">立即備份</button>
    <button class="later" onclick="snoozeBackup()">稍後再說</button>`;
}

function snoozeBackup(){BK_SNOOZE=Date.now();doSave();renderBackupNote();}

function renderDataHint(){
  const el=document.getElementById('data-hint');
  el.textContent=canShareBackup()
    ?'按「備份資料」會跳出分享選單,可以傳到 LINE 給自己、存進雲端硬碟或存成檔案。換手機時在新手機按「還原資料」選那個檔案,就能把紀錄搬過去。'
    :'按「備份資料」會把紀錄存成一個檔案(這台裝置不支援系統分享選單,所以是直接下載)。換手機時在新手機按「還原資料」選那個檔案,就能把紀錄搬過去。';
}

function importData(inp){
  const f=inp.files&&inp.files[0];
  inp.value='';
  if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    let d;
    try{d=JSON.parse(e.target.result)}
    catch(err){alert('還原失敗:這個檔案不是改裝帳本的備份。');return}
    const n=Array.isArray(d.items)?d.items.length:0;
    if(!confirm('即將還原 '+n+' 筆資料,並「覆蓋」目前所有內容。\n\n如果現在的紀錄還沒備份,建議先取消並按「備份資料」。確定要繼續嗎?'))return;
    try{applyData(d)}
    catch(err){alert('還原失敗:'+err.message);return}
    BK=Date.now();BK_SNOOZE=0;      // 剛從備份檔還原,視同手上已有備份
    resetForm();renderAll();doSave();
    toast('已還原 '+ITEMS.length+' 筆資料');
  };
  r.readAsText(f);
}

function clearAll(){
  if(!confirm('確定要清空全部資料嗎?\n\n所有零件、照片、車名與版面設定都會刪除,無法復原。\n建議先按「備份資料」。'))return;
  if(!confirm('再確認一次 — 真的要全部清空?'))return;
  VEHICLE={name:'',sub:''};ITEMS=[];TUNE=[];NEXT_ID=0;
  LAYOUT={catOrder:[...CATS],wish:true,tune:true,cover:null};
  SHOW_EDIT=false;STATE.status='all';STATE.cat='all';STATE.q='';
  document.getElementById('q').value='';
  resetForm();renderAll();doSave();
  toast('已清空,可以開始建立自己的帳本了');
}

let toastTimer=null;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('on'),2600);
}

/* ══════════ 車名(就地編輯) ══════════ */
function renderName(){
  const nm=VEHICLE.name||'我的愛車';
  document.getElementById('veh-name').textContent=nm;
  document.getElementById('veh-h1').classList.toggle('unset',!VEHICLE.name);
  document.getElementById('veh-sub').textContent=VEHICLE.sub||'BUILD SHEET';
  document.getElementById('foot').textContent=VEHICLE.sub||'BUILD SHEET · MOD LEDGER';
  document.title=nm+' BUILD SHEET';
}

let INLINE_BUSY=false;
function editInline(field){
  if(INLINE_BUSY)return;
  INLINE_BUSY=true;
  const sp=document.getElementById(field==='name'?'veh-name':'veh-sub');
  const inp=document.getElementById(field==='name'?'veh-name-in':'veh-sub-in');
  inp.value=field==='name'?VEHICLE.name:VEHICLE.sub;
  sp.hidden=true;inp.hidden=false;
  inp.focus();inp.select();
  const finish=commit=>{
    if(!INLINE_BUSY)return;
    INLINE_BUSY=false;
    inp.onkeydown=null;inp.onblur=null;
    inp.hidden=true;sp.hidden=false;
    if(!commit)return;
    const v=inp.value.trim();
    const old=field==='name'?VEHICLE.name:VEHICLE.sub;
    if(v===old)return;
    if(field==='name')VEHICLE.name=v;else VEHICLE.sub=v;
    renderName();renderShow();save();
    toast(field==='name'?'車名已更新':'標語已更新');
  };
  inp.onkeydown=e=>{
    if(e.key==='Enter'){e.preventDefault();finish(true);}
    else if(e.key==='Escape'){e.preventDefault();finish(false);}
  };
  inp.onblur=()=>finish(true);
}

/* ══════════ 圖片 ══════════ */
function downscale(file,cb){
  const r=new FileReader();
  r.onload=e=>{const img=new Image();
    img.onload=()=>{const m=1280,sc=Math.min(1,m/Math.max(img.width,img.height));
      const cv=document.createElement('canvas');
      cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      cb(cv.toDataURL('image/jpeg',.85));};
    img.src=e.target.result;};
  r.readAsDataURL(file);
}
function pickItemPhoto(id){PHOTO_TARGET=id;document.getElementById('item-photo-input').click();}
function onItemPhotoChosen(inp){
  const f=inp.files&&inp.files[0];if(!f||PHOTO_TARGET===null){inp.value='';return;}
  downscale(f,url=>{const it=ITEMS.find(i=>i.id===PHOTO_TARGET);if(it){it.img=url;renderShow();}});
  inp.value='';
}
function pickCover(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  downscale(f,url=>{LAYOUT.cover=url;renderShow();});
  inp.value='';
}
function openLightbox(src){
  document.getElementById('lightbox-img').src=src;
  document.getElementById('lightbox').classList.add('on');
}

/* ══════════ 附加費用 ══════════ */
function renderAddons(){
  document.getElementById('addon-list').innerHTML=FORM_ADD.map((a,x)=>`
    <div class="addon-chip"><span class="t">${esc(a.t)}</span><span class="p">${fmt(a.p)}</span>
    <button class="x" onclick="FORM_ADD.splice(${x},1);renderAddons()" title="移除">✕</button></div>`).join('');
}
function addAddon(){
  const t=document.getElementById('a-add-t').value.trim();
  const p=Math.max(0,parseInt(document.getElementById('a-add-p').value)||0);
  if(!t){document.getElementById('a-add-t').focus();return;}
  FORM_ADD.push({t,p});
  document.getElementById('a-add-t').value='';document.getElementById('a-add-p').value='';
  renderAddons();
}

/* ══════════ 紀錄模式 ══════════ */
function stats(){
  const on=ITEMS.filter(i=>i.s==='on'),out=ITEMS.filter(i=>i.s==='out'),wish=ITEMS.filter(i=>i.s==='wish');
  return{on,out,wish,spent:sum(on)+sum(out)};
}

function renderStats(){
  const s=stats();
  const rec=s.out.reduce((t,i)=>t+(i.rec||0),0);
  document.getElementById('stats').innerHTML=`
    <div class="stat total"><div class="k">歷史總投入</div><div class="v">${fmt(s.spent)}</div></div>
    <div class="stat"><div class="k">現役車上價值</div><div class="v">${fmt(sum(s.on))}</div></div>
    <div class="stat out"><div class="k">退役沉沒成本${rec?'(已扣回收)':''}</div><div class="v">${fmt(sum(s.out)-rec)}</div></div>
    <div class="stat wish"><div class="k">願望清單待購</div><div class="v">${fmt(sum(s.wish))}</div></div>`;
}

function renderBars(){
  const el=document.getElementById('bars');
  const rows=CATS.map(c=>({c,v:sum(ITEMS.filter(i=>i.c===c&&i.s!=='wish'))})).filter(r=>r.v>0).sort((a,b)=>b.v-a.v);
  if(!rows.length){el.hidden=true;el.innerHTML='';return;}
  el.hidden=false;
  const max=rows[0].v;
  el.innerHTML='<h3>各系統投入(含已退役)</h3>'+rows.map(r=>`
    <div class="bar-row"><span>${r.c}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${(r.v/max*100).toFixed(1)}%"></div></div>
      <span class="bar-amt">${fmt(r.v)}</span></div>`).join('');
}

function renderFilters(){
  const st=[['all','全部',''],['on','現役',''],['out','已退役','gray'],['wish','願望清單','gold']];
  document.getElementById('f-status').innerHTML=st.map(([k,label,cls])=>
    `<button class="chip ${cls} ${STATE.status===k?'on':''}" onclick="STATE.status='${k}';resetPage();renderFilters();renderList()">${label}</button>`).join('');
  document.getElementById('f-cat').innerHTML=['all',...CATS].map(c=>
    `<button class="chip ${STATE.cat===c?'on':''}" onclick="STATE.cat='${c}';resetPage();renderFilters();renderList()">${c==='all'?'所有分類':c}</button>`).join('');
}

function renderList(){
  const rowsEl=document.getElementById('rows');
  const noteEl=document.getElementById('count-note');
  if(!ITEMS.length){
    rowsEl.className='empty';
    rowsEl.innerHTML=`<span class="big">還沒有任何項目</span>
      1. 點上方的<b>車名文字</b>即可直接修改<br>
      2. 用上面的表單新增第一件改裝品<br>
      3. 資料會自動存在這台裝置,記得偶爾<b>備份資料</b>`;
    document.getElementById('pager').hidden=true;
    noteEl.textContent='';
    return;
  }
  rowsEl.className='rows';
  const q=STATE.q.trim().toLowerCase();
  const list=ITEMS.filter(i=>
    (STATE.status==='all'||i.s===STATE.status)&&
    (STATE.cat==='all'||i.c===STATE.cat)&&
    (!q||(i.b+i.n).toLowerCase().includes(q)))
    // 最近修改的排前面;舊資料沒有 mt,用 id 遞補(id 越大越新)
    .sort((a,b)=>(b.mt||0)-(a.mt||0)||b.id-a.id);
  const pages=Math.max(1,Math.ceil(list.length/PAGE_SIZE));
  if(PAGE>pages)PAGE=pages;
  const shown=list.slice((PAGE-1)*PAGE_SIZE,PAGE*PAGE_SIZE);
  rowsEl.innerHTML=list.length?shown.map(i=>`
    <div class="row ${i.s} ${i.id===EDIT_ID?'editing':''}" onclick="editItem(${i.id})">
      <span class="dot ${i.s}"></span>
      <div><div class="name"><b>${esc(i.b)}</b>${esc(i.n)}${i.add&&i.add.length?'<span class="badge">客製</span>':''}</div>
        <div class="meta">${i.c}${i.pos?'·'+POS_NAME[i.pos]:''} · ${ST_NAME[i.s]} · ${i.d}${addSum(i)?` · 本體 ${fmt(i.p)} + 附加 ${fmt(addSum(i))}`:''}${i.rec?` · 回收 ${fmt(i.rec)}`:''}</div></div>
      <div class="price ${itemTotal(i)?'':'tbd'}">${itemTotal(i)?fmt(itemTotal(i)):'未定價'}</div>
    </div>`).join(''):'<div class="row"><span></span><div class="name" style="color:var(--sub)">沒有符合的項目 — 換個條件試試</div><div></div></div>';
  renderPager(pages,list.length);
  const priced=list.filter(i=>itemTotal(i)>0);
  noteEl.textContent=`共 ${list.length} 項 · 小計 ${fmt(sum(priced))}${list.length-priced.length?` · 另有 ${list.length-priced.length} 項未定價`:''}`;
}

function renderPager(pages,total){
  const el=document.getElementById('pager');
  if(pages<=1){el.hidden=true;el.innerHTML='';return;}
  el.hidden=false;
  const from=(PAGE-1)*PAGE_SIZE+1,to=Math.min(PAGE*PAGE_SIZE,total);
  // 頁碼視窗:目前頁前後各一頁,首尾恆顯示,中間以 … 省略
  const nums=[];
  for(let p=1;p<=pages;p++){
    if(p===1||p===pages||Math.abs(p-PAGE)<=1)nums.push(p);
    else if(nums[nums.length-1]!=='…')nums.push('…');
  }
  el.innerHTML=`
    <button class="pg" onclick="goPage(${PAGE-1})" ${PAGE===1?'disabled':''} title="上一頁">‹</button>
    ${nums.map(n=>n==='…'?'<span class="pg-gap">…</span>':`<button class="pg ${n===PAGE?'on':''}" onclick="goPage(${n})">${n}</button>`).join('')}
    <button class="pg" onclick="goPage(${PAGE+1})" ${PAGE===pages?'disabled':''} title="下一頁">›</button>
    <span class="pg-info">${from}–${to} / ${total}</span>`;
}

function saveItem(){
  const b=document.getElementById('a-brand').value.trim()||'—';
  const n=document.getElementById('a-name').value.trim();
  if(!n){document.getElementById('a-name').focus();return;}
  const p=Math.max(0,parseInt(document.getElementById('a-price').value)||0);
  const c=document.getElementById('a-cat').value,s=document.getElementById('a-status').value;
  const d=document.getElementById('a-date').value||today();
  const pos=document.getElementById('a-pos').value||undefined;
  const mt=stamp();
  if(SWAP_ID!==null){
    // 汰換:舊件退役(記回收金額),新件以現役入帳
    const old=ITEMS.find(i=>i.id===SWAP_ID);
    if(old){
      old.s='out';
      old.rec=Math.max(0,parseInt(document.getElementById('a-rec').value)||0);
      old.v=false; // 退役品預設不放進展示頁,想放再去展示模式點亮
      old.mt=mt;
    }
    ITEMS.unshift({id:NEXT_ID++,b,n,p,c,s:'on',d,pos,mt,add:FORM_ADD.length?[...FORM_ADD]:undefined});
  }else if(EDIT_ID===null){
    ITEMS.unshift({id:NEXT_ID++,b,n,p,c,s,d,pos,mt,add:FORM_ADD.length?[...FORM_ADD]:undefined});
  }else{
    const it=ITEMS.find(i=>i.id===EDIT_ID);
    if(it)Object.assign(it,{b,n,p,c,s,d,pos,mt,add:FORM_ADD.length?[...FORM_ADD]:undefined});
  }
  resetPage();          // 剛動過的項目會排在第一頁最前面
  resetForm();renderAll();
}

function editItem(id){
  const it=ITEMS.find(i=>i.id===id);
  if(!it)return;
  EDIT_ID=id;SWAP_ID=null;
  document.getElementById('a-brand').value=it.b==='—'?'':it.b;
  document.getElementById('a-name').value=it.n;
  document.getElementById('a-price').value=it.p||'';
  document.getElementById('a-cat').value=it.c;
  document.getElementById('a-status').value=it.s;
  document.getElementById('a-date').value=it.d;
  document.getElementById('a-pos').value=it.pos||'';
  FORM_ADD=(it.add||[]).map(a=>({...a}));renderAddons();
  document.getElementById('form-title').textContent='✎ 編輯:'+it.n;
  document.getElementById('btn-save').textContent='儲存變更';
  document.getElementById('btn-cancel').hidden=false;
  document.getElementById('btn-del').hidden=false;
  document.getElementById('btn-swap').hidden=it.s!=='on';
  document.getElementById('rec-wrap').hidden=true;
  renderList();
  document.getElementById('addbox').scrollIntoView({behavior:'smooth',block:'center'});
}

function startSwap(){
  const old=ITEMS.find(i=>i.id===EDIT_ID);
  if(!old)return;
  SWAP_ID=old.id;EDIT_ID=null;
  document.getElementById('a-brand').value='';
  document.getElementById('a-name').value='';
  document.getElementById('a-price').value='';
  document.getElementById('a-cat').value=old.c;
  document.getElementById('a-status').value='on';
  document.getElementById('a-date').value=today();
  document.getElementById('a-pos').value=old.pos||'';
  document.getElementById('a-rec').value='';
  FORM_ADD=[];renderAddons();
  document.getElementById('form-title').textContent='⇄ 汰換「'+old.n+'」— 填入新零件';
  document.getElementById('btn-save').textContent='完成汰換';
  document.getElementById('btn-swap').hidden=true;
  document.getElementById('btn-del').hidden=true;
  document.getElementById('btn-cancel').hidden=false;
  document.getElementById('rec-wrap').hidden=false;
  renderList();
  document.getElementById('a-name').focus();
}

function deleteItem(){
  const idx=ITEMS.findIndex(i=>i.id===EDIT_ID);
  if(idx>-1)ITEMS.splice(idx,1);
  resetForm();renderAll();
}

function resetForm(){
  EDIT_ID=null;SWAP_ID=null;
  FORM_ADD=[];renderAddons();
  ['a-brand','a-name','a-price','a-rec','a-add-t','a-add-p'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('a-date').value=today();
  document.getElementById('a-pos').value='';
  document.getElementById('form-title').textContent='＋ 新增項目';
  document.getElementById('btn-save').textContent='加入清單';
  document.getElementById('btn-cancel').hidden=true;
  document.getElementById('btn-del').hidden=true;
  document.getElementById('btn-swap').hidden=true;
  document.getElementById('rec-wrap').hidden=true;
  renderList();
}

/* ══════════ 展示模式 ══════════ */
function renderShow(){
  const s=stats();
  const brands=new Set(ITEMS.filter(i=>i.s==='on'&&!['工資','烤漆','手工','保養','—','碳纖維','原廠'].includes(i.b)).map(i=>i.b));
  const sysCount=new Set(s.on.map(i=>i.c)).size;
  document.getElementById('plate').innerHTML=`
    <div class="eyebrow">Owner's Build Sheet</div>
    <h2>${esc(VEHICLE.name||'我的愛車')}</h2>
    <div class="en">${esc(VEHICLE.sub||'Build Sheet')}</div>
    ${LAYOUT.cover?`<img class="cover" src="${LAYOUT.cover}" alt="" onclick="openLightbox(this.src)">`:''}
    <div class="plate-stats">
      <div class="ps big"><div class="k">現役改裝零件</div><div class="v">${s.on.length}<span style="font-size:18px;color:var(--sub);font-weight:500"> 件</span></div></div>
      <div class="ps"><div class="k">合作品牌</div><div class="v">${brands.size} 家</div></div>
      <div class="ps"><div class="k">涵蓋系統</div><div class="v">${sysCount} 大類</div></div>
      <div class="ps"><div class="k">歷經退役</div><div class="v">${s.out.length} 件</div></div>
    </div>`;

  const secOrder=LAYOUT.catOrder;
  const secsHtml=secOrder.map((c,pos)=>{
    const all=ITEMS.filter(i=>i.s==='on'&&i.c===c);
    const vis=all.filter(i=>i.v!==false);
    if(!all.length)return'';
    if(!SHOW_EDIT&&!vis.length)return'';
    const list=SHOW_EDIT?all:vis;
    const secTools=SHOW_EDIT?`<span class="tools">
      <button class="mini" onclick="moveCat('${c}',-1)" ${pos===0?'disabled':''} title="整區上移">▲</button>
      <button class="mini" onclick="moveCat('${c}',1)" ${pos===secOrder.length-1?'disabled':''} title="整區下移">▼</button></span>`:'';
    const post=c==='懸吊'?tuneCard():'';
    return `<div class="sec">
      <div class="sec-head"><h3>${c}<span class="en">　${CAT_EN[c]}</span></h3><span>${secTools}<span class="sum">　${vis.length} 件</span></span></div>
      ${posGrouped(list)}</div>`+post;
  }).join('');
  document.getElementById('show-secs').innerHTML=secsHtml||
    `<div class="empty"><span class="big">展示頁還是空的</span>
      到<b>紀錄模式</b>新增現役零件,這裡就會自動長出你的 Build Sheet。<br>
      展示頁不顯示金額,可以放心分享給車友。</div>`;

  document.getElementById('show-wish').innerHTML=groupSec('wish','下一步','Up Next','gold',LAYOUT.wish);

  document.getElementById('cover-btns').innerHTML=SHOW_EDIT?`
    <button onclick="document.getElementById('a-cover').click()">${LAYOUT.cover?'更換封面照':'＋ 設定封面照'}</button>
    ${LAYOUT.cover?'<button onclick="LAYOUT.cover=null;renderShow()">移除封面</button>':''}`:'';
  document.getElementById('btn-layout').textContent=SHOW_EDIT?'✔ 完成':'✎ 編輯版面';
  document.getElementById('btn-layout').classList.toggle('on',SHOW_EDIT);
  document.getElementById('edit-hint').hidden=!SHOW_EDIT;
  save();
}

function tuneCard(){
  if(!SHOW_EDIT&&(!LAYOUT.tune||!TUNE.length))return'';
  const tools=SHOW_EDIT?`<span class="tools">
    <button class="mini ${LAYOUT.tune?'':'eye-off'}" onclick="LAYOUT.tune=!LAYOUT.tune;renderShow()" title="顯示/隱藏">👁</button></span>`:'';
  const cells=TUNE.map((t,x)=>SHOW_EDIT?`
    <div class="cell"><div class="k"><input value="${esc(t.k)}" onchange="TUNE[${x}].k=this.value;save()" placeholder="項目名稱"></div>
      <div class="v-row"><input class="v-in" value="${esc(t.v)}" onchange="TUNE[${x}].v=this.value;save()" placeholder="設定值">
      <button class="mini" onclick="TUNE.splice(${x},1);renderShow()" title="移除">✕</button></div></div>`:`
    <div class="cell"><div class="k">${esc(t.k)}</div><div class="v">${esc(t.v)}</div></div>`).join('');
  const addBtn=SHOW_EDIT?`<button class="tune-add" onclick="TUNE.push({k:'',v:''});renderShow()">＋ 新增一格</button>`:'';
  const emptyHint=SHOW_EDIT&&!TUNE.length?'<div style="font-size:12px;color:var(--sub)">還沒有設定值 — 按下面新增一格,記下你的前後避震調校。</div>':'';
  return`<div class="tune ${SHOW_EDIT&&!LAYOUT.tune?'dim':''}">
    <h3>避震設定備忘${tools}</h3>
    ${emptyHint}<div class="grid">${cells}</div>${addBtn}</div>`;
}

function groupSec(status,title,en,cls,visible){
  const all=ITEMS.filter(i=>i.s===status);
  if(!all.length)return'';
  const vis=all.filter(i=>i.v!==false);
  if(!SHOW_EDIT&&(!visible||!vis.length))return'';
  const list=SHOW_EDIT?all:vis;
  const secTools=SHOW_EDIT?`<span class="tools">
    <button class="mini ${visible?'':'eye-off'}" onclick="LAYOUT.${status}=!LAYOUT.${status};renderShow()" title="顯示/隱藏整區">👁</button></span>`:'';
  return`<div class="sec ${cls} ${SHOW_EDIT&&!visible?'dim-sec':''}">
    <div class="sec-head"><h3>${title}<span class="en">　${en}</span></h3><span>${secTools}<span class="sum">　${vis.length} 件</span></span></div>
    ${list.map(catRow).join('')}</div>`;
}

function posGrouped(list){
  if(!list.some(i=>i.pos))return list.map(catRow).join('');
  const POS_EN={F:'Front',R:'Rear','':''};
  return['F','R',''].map(pz=>{
    const g=list.filter(i=>(i.pos||'')===pz);
    if(!g.length)return'';
    const label=pz?`<div class="sub-div">${POS_NAME[pz]}　${POS_EN[pz]}</div>`:(g.length===list.length?'':'<div class="sub-div">不分區</div>');
    return label+g.map(catRow).join('');
  }).join('');
}

function catRow(i){
  const tools=SHOW_EDIT?`<span class="tools">
    <button class="mini" onclick="moveItem(${i.id},-1)" title="上移">▲</button>
    <button class="mini" onclick="moveItem(${i.id},1)" title="下移">▼</button>
    <button class="mini ${i.img?'':'eye-off'}" onclick="pickItemPhoto(${i.id})" title="${i.img?'更換照片':'新增照片'}">📷</button>
    ${i.img?`<button class="mini" onclick="ITEMS.find(x=>x.id===${i.id}).img=null;renderShow()" title="移除照片">✕</button>`:''}
    <button class="mini ${i.v===false?'eye-off':''}" onclick="toggleItem(${i.id})" title="顯示/隱藏">👁</button></span>`:'';
  const thumb=i.img?`<img class="thumb" src="${i.img}" alt="" onclick="openLightbox(this.src)" style="margin-right:10px">`
    :(SHOW_EDIT?`<span class="thumb-ph" onclick="pickItemPhoto(${i.id})" title="新增照片">📷</span>`:'');
  return`<div class="cat-row ${SHOW_EDIT&&i.v===false?'dim':''}">${thumb}<span class="b">${esc(i.b)}</span><span class="n">${esc(i.n)}${i.add&&i.add.length?'<span class="badge">客製</span>':''}</span>${tools}</div>`;
}

function toggleShowEdit(){SHOW_EDIT=!SHOW_EDIT;renderShow();}
function toggleItem(id){const it=ITEMS.find(i=>i.id===id);if(it){it.v=it.v===false;renderShow();}}
function moveCat(c,dir){
  const o=LAYOUT.catOrder,a=o.indexOf(c),b=a+dir;
  if(b<0||b>=o.length)return;
  [o[a],o[b]]=[o[b],o[a]];renderShow();
}
function moveItem(id,dir){
  const it=ITEMS.find(i=>i.id===id);if(!it)return;
  const group=ITEMS.filter(x=>x.s===it.s&&(it.s!=='on'||(x.c===it.c&&(x.pos||'')===(it.pos||''))));
  const gi=group.indexOf(it),gj=gi+dir;
  if(gj<0||gj>=group.length)return;
  const a=ITEMS.indexOf(group[gi]),b=ITEMS.indexOf(group[gj]);
  [ITEMS[a],ITEMS[b]]=[ITEMS[b],ITEMS[a]];
  renderShow();renderList();
}

function setMode(m){
  document.getElementById('view-rec').classList.toggle('on',m==='rec');
  document.getElementById('view-show').classList.toggle('on',m==='show');
  document.getElementById('tab-rec').classList.toggle('on',m==='rec');
  document.getElementById('tab-show').classList.toggle('on',m==='show');
  window.scrollTo({top:0});
}

function renderAll(){renderName();renderStats();renderBars();renderFilters();renderList();renderShow();renderBackupNote();renderDataHint();}

/* ══════════ 啟動 ══════════ */
document.getElementById('a-cat').innerHTML=CATS.map(c=>`<option>${c}</option>`).join('');
document.getElementById('a-date').value=today();
loadSaved();
renderAll();
doSave();
</script>
